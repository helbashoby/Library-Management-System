{% extends "base.html" %}
{% block title %}Student Login | Library Management System{% endblock %}

{% block content %}
<section class="auth-wrap">
    <div class="card auth-card">
        <p class="eyebrow">Student Portal</p>
        <h1>Student Login</h1>
        <p class="muted">Enter your student ID and name to continue.</p>

        {% if error %}
            <p class="form-error">{{ error }}</p>
        {% endif %}

        <form id="student-login-form" class="form" method="post" action="{{ url_for('student_login_api') }}">
            <label for="student_id">Student ID</label>
            <input
                type="text"
                id="student_id"
                name="student_id"
                placeholder="e.g. PKD25IT004"
                required
            >

            <label for="student_name">Student Name</label>
            <input
                type="text"
                id="student_name"
                name="student_name"
                placeholder="Enter your name"
                required
            >

            <button type="submit" class="btn btn-primary btn-full">Login</button>
        </form>

        <a class="back-link" href="{{ url_for('home') }}">Back to home</a>
    </div>
</section>
{% endblock %}
